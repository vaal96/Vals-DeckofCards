<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Val's Game</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="game">
        <h1>Play Val's Game ♥️</h1>

        <button id="dealBtn">Deal 5 Cards</button>

        <div class="board">
            <div class="player">
                <h2>You</h2>
                <div class="hand" id="player-hand"></div>
                <p class="score" id="player-score"></p>
            </div>

            <div class="player">
                <h2>Opponent</h2>
                <div class="hand" id="opponent-hand"></div>
                <p class="score" id="opponent-score"></p>
            </div>
        </div>

        <p id="message" class="message"></p>
    </div>

    <script src="script.js"></script>
</body>

</html>
